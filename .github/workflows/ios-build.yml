name: BOSSMASTER iPad Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      signed:
        description: "สร้าง IPA สำหรับ iPad จริงด้วย Apple signing"
        required: true
        default: false
        type: boolean

jobs:
  build_unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project BOSSMASTERiPad.xcodeproj \
            -scheme BOSSMASTERiPad \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package source
        run: |
          zip -r BOSSMASTER-iPad-source.zip \
            BOSSMASTERiPad project.yml README_TH.md .github

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOSSMASTER-iPad-source
          path: BOSSMASTER-iPad-source.zip

  build_signed_ipa:
    if: ${{ inputs.signed == true }}
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.bossmaster.ipad
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple signing certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > signing_certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security import signing_certificate.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain-db

      - name: Install Ad Hoc provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/BOSSMASTER.mobileprovision"

      - name: Archive signed iPad app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project BOSSMASTERiPad.xcodeproj \
            -scheme BOSSMASTERiPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BOSSMASTERiPad.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="BOSSMASTER iPad Ad Hoc" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>BOSSMASTER iPad Ad Hoc</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BOSSMASTERiPad.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOSSMASTER-iPad-IPA
          path: "$RUNNER_TEMP/export/*.ipa"
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOSSMASTER-iPad-signing-log
          path: "$RUNNER_TEMP/archive.log"
          if-no-files-found: ignore
